# /etc/xpsu.conf - xpsu (express su) authorization rules
#
# Syntax:
#   permit [nopass] [persist] [keepenv] identity [as target] [cmd path [args ...]]
#   deny   identity [as target]
#
# identity: a user name, or ":groupname" to match a whole group
# target:   the user the command will run as (default: root)
# nopass:   skip password prompt entirely
# persist:  after a successful auth, further calls skip the password
#           prompt for PERSIST_TIMEOUT seconds (see xpsu.c)
# keepenv:  keep the caller's environment instead of resetting it
#
# The LAST rule that matches wins (same precedence as doas).
#
# Examples:

# Let anyone in the wheel group become root without a password
# permit nopass :wheel as root

# Let "user" become root, asking for a password
permit user as root

# Let "user" become root with password caching for a few minutes
# permit persist user as root

# Let "user" run xpkg as root without a password
permit nopass user as root cmd /usr/local/bin/xpkg

# Explicitly deny "guest"
deny guest as root
