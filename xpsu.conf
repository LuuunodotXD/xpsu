# /etc/xpsu.conf - xpsu (express su) authorization rules
#
# This file MUST be owned by root and not writable by group/others
# (root:root, mode 0640), otherwise xpsu refuses to run.
# xpsu also refuses to run if this file has ANY syntax error, so always
# check your changes before saving them over the installed file:
#
#   xpsu -C ./xpsu.conf         (check a copy, no root needed)
#   su -c 'xpsu -C /etc/xpsu.conf'
#
# ---------------------------------------------------------------------
# Syntax
# ---------------------------------------------------------------------
#   permit [nopass] [persist] [keepenv] identity [as target] [cmd path [args [arg ...]]]
#   deny   identity [as target] [cmd path [args [arg ...]]]
#
#   identity  a user name, or ":groupname" to match a whole group
#   target    the user the command runs as (default: root)
#   nopass    never ask for a password (use sparingly, see below)
#   persist   after a successful login, don't ask again for 5 minutes
#             in the same terminal session (`xpsu -L` forgets it)
#   keepenv   keep the caller's environment instead of cleaning it
#             (PATH and friends come from the user: avoid on rules
#             that give full root)
#   cmd       restrict the rule to ONE command, by absolute path
#     (nothing)       any arguments are allowed
#     args a b c      only exactly these arguments are allowed
#     args            only the bare command, no arguments at all
#
# ---------------------------------------------------------------------
# How rules are evaluated
# ---------------------------------------------------------------------
#   * The LAST rule that matches wins (same as doas).
#   * So put general permits first, and specific denies / exceptions
#     AFTER them, otherwise the permit overrides the deny.
#   * If no rule matches, access is denied.
#   * `cmd` paths must be absolute, and are compared with the command
#     as it resolves, so give the real location (check `command -v x`).
#
# ---------------------------------------------------------------------
# Default policy
# ---------------------------------------------------------------------

# Members of the "wheel" group may become root, typing their own
# password once every 5 minutes.
#
# NOTE: on Debian/Ubuntu-style systems the admin group is called "sudo"
# instead of "wheel". If neither group exists on your system (or you are
# not a member), no one can use xpsu until you edit this file.
permit persist :wheel as root

# ---------------------------------------------------------------------
# Examples (uncomment and adapt)
# ---------------------------------------------------------------------

# A single user instead of a group, always asking for the password:
# permit alice as root

# Run one specific command as root without a password. Much safer than
# giving nopass for everything: only this exact command is allowed.
# permit nopass :wheel as root cmd /usr/local/bin/xpkg

# Only one exact invocation is allowed ("reboot" with no arguments, and
# "ls -l /tmp"):
# permit :wheel as root cmd /sbin/reboot args
# permit :wheel as root cmd /bin/ls args -l /tmp

# Let a user run commands as a service account instead of root:
# permit persist alice as www-data

# Keep the caller's environment for a specific, harmless tool:
# permit keepenv :wheel as root cmd /usr/bin/env

# Block a user or group. Keep deny rules BELOW the permits they override:
# deny guest as root
# deny :nobody as root
